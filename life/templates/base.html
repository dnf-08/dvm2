<!doctype html>
<html>
    <head>
        <meta charset =" utf-8">
        <title>life</title>
    </head>
</html>
<body>
    <nav>
        <a href= "{% url 'home'%}">Home</a>
        <!-- using django's in built is_autheticated which will return True if the user is a real one-->
        {%if user.is_autheticated %}
        {{user.username}}
        <form method="post" action="{% url 'logout' %}" style="display:inline">
        {% csrf_token %}<button>Log out</button>
      </form>
      <!--if user is not autheticated, give them the option to sign up or login-->
    {% else %}
      <a href="{%url 'login' %}">Log in</a>
      <a href="{% url 'signup' %}">Sign up</a>
    {% endif %}
    </nav>
    <hr>
    {% block content %}
    {% endblock %}
</body>
