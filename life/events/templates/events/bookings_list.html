{% extends "base.html" %}
{% block content %}
<h1>Bookings:</h1>
<table>
  <tr><th>Event</th><th>Booked at</th><th>Session start</th><th>Quantity</th><th>Total</th></tr>
  {% for b in bookings %}
  <tr>
    <td>{{b.session.event.title }}</td>
    <td>{{ b.created_at }}</td> 
    <td>{{ b.session.start_time }}</td>
    <td>{{ b.quantity}}</td>
    <td>{{ b.totalprice }}</td>
  </tr>
  {% empty %}
  <tr><td colspan="5">No bookings yet</td></tr>
  {% endfor %}
</table>
{% endblock %}
