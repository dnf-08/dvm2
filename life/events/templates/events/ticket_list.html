{% extends "base.html" %}
{% block content %}
<h1>Active tickets:</h1>
<table>
  <tr><th>Ticket ID</th><th>Event</th><th>Session start</th><th>Booked at</th></tr>
  {% for t in tickets %}
  <tr>
    <td>{{ t.ticketcode }}</td>
    <td>{{ t.booking.session.event.title}}</td>
    <td>{{ t.booking.session.start_time }}</td>
    <td>{{t.booking.created_at }}</td>
  </tr>
  {% empty %}
  <tr><td colspan="4">No active tickets</td></tr>
  {% endfor %}
</table>
{% endblock %}
